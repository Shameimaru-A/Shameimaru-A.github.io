<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="baka资源站" />
  <title>就要涩涩</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg-soft: #0f1522;
      --card: rgba(21, 28, 44, 0.72);
      --card-hover: rgba(27, 36, 54, 0.92);
      --border: rgba(120, 140, 180, 0.16);
      --text: #e6eaf2;
      --muted: #8b95a9;
      --accent: #6c8cff;
      --accent-2: #38bdf8;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    [data-theme="light"] {
      --bg: #f4f6fb;
      --bg-soft: #ffffff;
      --card: rgba(255, 255, 255, 0.85);
      --card-hover: #ffffff;
      --border: rgba(15, 25, 45, 0.10);
      --text: #1c2433;
      --muted: #5c6675;
      --shadow: 0 10px 26px rgba(30, 50, 90, 0.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at 15% -5%, rgba(108, 140, 255, 0.16), transparent 60%),
        radial-gradient(800px 460px at 90% 0%, rgba(56, 189, 248, 0.12), transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s ease;
    }
    a { color: inherit; text-decoration: none; }

    /* ===== 顶栏 ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1180px; margin: 0 auto; padding: 18px 22px 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center; font-size: 19px;
      box-shadow: 0 4px 14px rgba(108, 140, 255, 0.4);
    }
    .nav { display: flex; gap: 8px; margin-left: auto; }
    .nav-link {
      padding: 7px 14px; border-radius: 10px; font-size: 13.5px;
      color: var(--muted); border: 1px solid transparent; white-space: nowrap;
      transition: all 0.18s ease;
    }
    .nav-link:hover { color: var(--text); background: var(--card); border-color: var(--border); }
    .nav-link.active {
      color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 600; box-shadow: 0 4px 14px rgba(108, 140, 255, 0.35);
    }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    #clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer; font-size: 16px;
      transition: transform 0.15s ease, background 0.2s;
    }
    .icon-btn:hover { transform: translateY(-1px); background: var(--card-hover); }

    /* ===== 头部 ===== */
    .hero { max-width: 1180px; margin: 0 auto; padding: 46px 22px 10px; text-align: center; }
    .hero h1 { font-size: clamp(26px, 4.5vw, 40px); letter-spacing: 1px; }
    .hero h1 .grad {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p { margin-top: 10px; color: var(--muted); font-size: 14px; }
    .search-box {
      margin: 26px auto 0; max-width: 560px; position: relative;
    }
    .search-box .icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      width: 17px; height: 17px; color: var(--muted); pointer-events: none;
    }
    #searchInput {
      width: 100%; padding: 14px 46px 14px 46px; font-size: 15px;
      color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 14px; outline: none;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #searchInput::placeholder { color: var(--muted); }
    #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108, 140, 255, 0.18); }
    #clearBtn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; border: none; border-radius: 8px;
      background: transparent; color: var(--muted); font-size: 16px; cursor: pointer;
      display: none;
    }
    #clearBtn:hover { background: var(--border); }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); opacity: 0.8; }

    /* ===== 分类标签 ===== */
    .chips {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      margin-top: 22px;
    }
    .chip {
      padding: 7px 15px; border-radius: 999px; font-size: 13px; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      transition: all 0.18s ease; user-select: none;
    }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .chip.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-color: transparent; font-weight: 600;
      box-shadow: 0 4px 14px rgba(108, 140, 255, 0.35);
    }
    .chip .cnt { opacity: 0.75; font-size: 12px; margin-left: 4px; }

    /* ===== 卡片网格 ===== */
    .grid {
      max-width: 1180px; margin: 30px auto 0; padding: 0 22px;
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
    }
    .card {
      position: relative; display: flex; gap: 12px; padding: 16px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      opacity: 0; animation: fadeUp 0.4s ease forwards;
      animation-delay: calc(var(--i) * 28ms);
    }
    .card:hover {
      transform: translateY(-4px); border-color: var(--accent);
      box-shadow: var(--shadow); background: var(--card-hover);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-icon {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .card-icon .letter {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 19px; font-weight: 700; color: #fff;
    }
    .card-icon img { position: relative; width: 22px; height: 22px; z-index: 1; }
    .card-info { min-width: 0; }
    .card-name {
      font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px;
    }
    .card-name .domain { font-size: 11px; color: var(--muted); font-weight: 400; }
    .card-desc {
      margin-top: 4px; font-size: 12.5px; color: var(--muted); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
      background: rgba(108, 140, 255, 0.12); color: var(--accent);
      border: 1px solid rgba(108, 140, 255, 0.25);
    }

    /* ===== 空状态 ===== */
    .empty {
      max-width: 1180px; margin: 60px auto; padding: 0 22px; text-align: center; color: var(--muted);
    }
    .empty .big { font-size: 42px; margin-bottom: 12px; }

    footer {
      max-width: 1180px; margin: 46px auto 0; padding: 26px 22px 34px;
      text-align: center; font-size: 12.5px; color: var(--muted);
      border-top: 1px solid var(--border); opacity: 0.9;
    }
    footer .heart { color: #f87171; }

    @media (max-width: 560px) {
      .topbar { padding-top: 14px; }
      .brand span { display: none; }
      #clock { display: none; }
      .hero { padding-top: 34px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="logo">🌸</div>
      <span>涩涩导航站</span>
     </div>
    <nav class="nav">
      <a class="nav-link active" href="index.html">🏠 首页导航</a>
      <a class="nav-link" href="gallery.html">🎲 随机图库</a>
    </nav>
    <div class="topbar-right">
      <span id="clock">--</span>
      <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">🌙</button>
    </div>
  </div>

  <header class="hero">
    <h1>涩涩<span class="grad">网址导航</span></h1>
    <p>收录常用H网站与vpn资源 · 共 <span id="siteCount">0</span> 个站点</p>
    <div class="search-box">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line>
      </svg>
      <input id="searchInput" type="text" placeholder="搜索站点名称 / 描述 / 标签…" autocomplete="off" />
      <button id="clearBtn" title="清空" aria-label="清空搜索">✕</button>
    </div>
    <p class="hint">按 <kbd>/</kbd> 快速聚焦搜索 · 按 <kbd>Esc</kbd> 清空</p>
    <div class="chips" id="chips"></div>
  </header>

  <main class="grid" id="grid"></main>
  <div class="empty" id="empty" hidden>
    <div class="big">🔍</div>
    <p>没有找到匹配的站点，换个关键词试试？</p>
  </div>

  <footer>
咱不是baka
  </footer>

  <noscript>
    <p style="text-align:center; padding: 40px; color: var(--muted);">
      本页面需要启用 JavaScript 才能显示站点列表，请开启后刷新。
    </p>
  </noscript>

  <script>
    /* ============================================================
     * 站点数据：在这里增删改
     * 字段说明：
     *   name — 站点名称（显示在卡片标题）
     *   url  — 完整网址（https:// 开头）
     *   desc — 一句话描述
     *   cat  — 分类，必须是 CATEGORIES 里定义的 key（如 "ai"）
     *   tags — 标签数组，用于搜索匹配
     * ============================================================ */
    const CATEGORIES = {
      ai:        { label: "H动画",   },
      dev:       { label: "H漫画",   },
      design:    { label: "黄片网站",   },
      learn:     { label: "实用工具",   },
      community: { label: "未建设完成",   },
    };

    const SITES = [
      // ---------- AI 助手 ----------
      { name: "Hanime",    url: "https://Hanime1.me",          desc: "帶給你最新最全的無碼高清中文字幕Hentai成人動漫線上看。",            cat: "ai", tags: ["H动漫", "里番", "免费"] },
      { name: "iwara",     url: "https://www.iwara.tv",            desc: "同人3D动画，MMD以及H图片",    cat: "ai", tags: ["MMD", "3D动画", "3D色图"] },
      { name: "H次元",   url: "https://h-ciyuan.com",    desc: "本站主要以里番资源整理与分类为核心，后续逐步加入游戏相关内容，使整体结构更加丰富与完整。",                 cat: "ai", tags: ["H动画", "H游戏", "广告较多"] },
      { name: "Hentaimama",       url: "https://hentaimama.io",     desc: "欧美hentai网站，较多里番资源",             cat: "ai", tags: ["里番", "H动画", "广告较多"] },
      // ---------- 开发编程 ----------
      { name: "哔咔漫画",         url: "https://manhuabika.com",         desc: "嗶咔被玩壞了",       cat: "dev", tags: ["cg图集", "本子", "哔咔娘"] },
      { name: "NoyACG",          url: "https://noy.asia",          desc: "體驗現代的二次元漫畫社區",           cat: "dev", tags: ["精选本子", "服务器流畅", "界面美观"] },
      { name: "禁漫天堂", url: "https://jmcomictt.site",  desc: "回家的路，怕走失記得收藏哦",                 cat: "dev", tags: ["本子", "广告较多"] },
      { name: "E-Hentai",            url: "https://e-hentai.org", desc: "ehviewer老家",               cat: "dev", tags: ["欧美", "本子", "cg集"] },
      // ---------- 设计创意 ----------
      { name: "MissAV",    url: "https://missav.ws",   desc: "最佳日本AV色情网站，永久免费，高速无延迟，超过10万部视频，每日更新，播放视频时无广告。",    cat: "design", tags: ["AV", "搜索方便", "片源丰富"] },
      { name: "PornHub", url: "https://cn.pornhub.com",    desc: "Pornhub 为您提供海量全网最火成人影星出演的免费色情片。尽享全网最大素人色情社区以及来自顶级X级厂牌的完整长片。我们每日更新色情视频，包你每时每刻尽享最佳性爱电影。",            cat: "design", tags: ["片源丰富"] },
      { name: "Xvideos",  url: "https://www.videoxx.com", desc: "網絡上的最佳成人影視，100%免費",        cat: "design", tags: ["欧美", "三次元较多"] },
      { name: "ixxx",   url: "https://www.ixxx.com",      desc: "XX电影电视 - 免费色情电影",          cat: "design", tags: ["搜索方便", "界面美观"] },
      // ---------- 学习教程 ----------
      { name: "EHviewerApp",   url: "https://github.com/xiaojieonly/Ehviewer_CN_SXJ",       desc: "e站手机软件",                 cat: "learn"},
      { name: "Bangumi For Android",   url: "https://github.com/xiaoyvyv/bangumi/releases",          desc: "bangumi安卓第三方客户端",           cat: "learn"},
      { name: "snowluma", url: "https://github.com/SnowLuma/SnowLuma/releases", desc: "注入桌面端qq进程以运行大肥鱼的工具",               cat: "learn"},
      { name: "napcat",   url: "https://github.com/NapNeko/NapCatQQ",     desc: "基于 TypeScript 构建的 Bot 框架，通过相应的启动器或者框架，主动调用 QQ Node 模块提供给客户端的接口，实现 Bot 的功能。",       cat: "learn"},
      { name: "astrbot",   url: "https://github.com/AstrBotDevs/AstrBot-desktop/releases/tag/v4.29.1",     desc: "私は、高性能ですから!",               cat: "learn"},
      { name: "免费机场",       url: "https://www.askahh.com/archives/17/",         desc: "免费机场总结",             cat: "learn"},
      { name: "宝可梦加速器",       url: "https://love3.p6m6.com",        desc: "免费加速器",             cat: "learn"},
      { name: "Han1meviewer",   url: "https://github.com/daisukiKaffuChino/Han1meViewer/releases",     desc: "hanime1安卓第三方客户端",             cat: "learn"},

      // ---------- 社区论坛 ----------
      { name: "1",          url: "https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click&vd_source=b907c496dd1c48a62e7c4f0f93b58804",        desc: "1",         cat: "community"},
      { name: "2",        url: "https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click&vd_source=b907c496dd1c48a62e7c4f0f93b58804",           desc: "2",         cat: "community"},
      { name: "3",   url: "https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click&vd_source=b907c496dd1c48a62e7c4f0f93b58804", desc: "3",        cat: "community"},
      { name: "4",        url: "https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click&vd_source=b907c496dd1c48a62e7c4f0f93b58804",      desc: "4",         cat: "community"},
      { name: "5",      url: "https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click&vd_source=b907c496dd1c48a62e7c4f0f93b58804",            desc: "5",             cat: "community"},
      { name: "6",          url: "https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click&vd_source=b907c496dd1c48a62e7c4f0f93b58804",     desc: "6",                 cat: "community"},
    ];

    /* ================= 渲染逻辑（一般无需修改） ================= */
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const chipsEl = document.getElementById("chips");
    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const siteCount = document.getElementById("siteCount");

    let activeCat = "all";
    let keyword = "";

    // 域名提取（用于图标与搜索）
    const domainOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } };
    // 名字哈希 → 色相，给无图标站点一个稳定的渐变底色
    const hueOf = (name) => {
      let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360; return h;
    };

    function renderChips() {
      const cats = [["all", "🌐 全部"], ...Object.entries(CATEGORIES).map(([k, v]) => [k, v.label])];
      chipsEl.innerHTML = cats.map(([key, label]) => {
        const cnt = key === "all" ? SITES.length : SITES.filter(s => s.cat === key).length;
        return `<button class="chip ${key === activeCat ? "active" : ""}" data-cat="${key}">
                  ${label}<span class="cnt">${cnt}</span>
                </button>`;
      }).join("");
    }

    function renderGrid() {
      const kw = keyword.trim().toLowerCase();
      const list = SITES
        .map((site, idx) => ({ ...site, idx }))
        .filter(({ cat, name, desc, tags, url }) => {
          const okCat = activeCat === "all" || cat === activeCat;
          if (!okCat) return false;
          if (!kw) return true;
          const hay = [name, desc, ...(tags || []), domainOf(url)].join(" ").toLowerCase();
          return hay.includes(kw);
        });

      if (!list.length) { grid.innerHTML = ""; empty.hidden = false; return; }
      empty.hidden = true;

      grid.innerHTML = list.map(({ idx, name, url, desc, tags }) => {
        const domain = domainOf(url);
        const letter = name.trim().charAt(0).toUpperCase();
        return `
          <a class="card" href="${url}" target="_blank" rel="noopener noreferrer"
             style="--i:${idx % 20};">
            <div class="card-icon" style="background:linear-gradient(135deg,
                 hsl(${hueOf(name)} 72% 56%), hsl(${(hueOf(name) + 40) % 360} 72% 44%));">
              <span class="letter">${letter}</span>
              <img src="https://icons.duckduckgo.com/ip3/${domain}.ico" alt=""
                   loading="lazy" onerror="this.style.display='none'" />
            </div>
            <div class="card-info">
              <div class="card-name">${name}<span class="domain">${domain}</span></div>
              <div class="card-desc">${desc}</div>
              <div class="card-tags">${(tags || []).map(t => `<span class="tag">${t}</span>`).join("")}</div>
            </div>
          </a>`;
      }).join("");
    }

    // 搜索
    searchInput.addEventListener("input", () => {
      keyword = searchInput.value;
      clearBtn.style.display = keyword ? "block" : "none";
      renderGrid();
    });
    clearBtn.addEventListener("click", () => {
      searchInput.value = ""; keyword = "";
      clearBtn.style.display = "none";
      renderGrid(); searchInput.focus();
    });

    // 分类切换
    chipsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      activeCat = btn.dataset.cat;
      renderChips();
      renderGrid();
    });

    // 快捷键
    document.addEventListener("keydown", (e) => {
      const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
      if (e.key === "/" && !typing) { e.preventDefault(); searchInput.focus(); }
      if (e.key === "Escape" && typing) { searchInput.blur(); }
    });

    // 时钟
    function tick() {
      const now = new Date();
      const week = ["日", "一", "二", "三", "四", "五", "六"][now.getDay()];
      const pad = n => String(n).padStart(2, "0");
      document.getElementById("clock").textContent =
        `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 周${week} ` +
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    tick(); setInterval(tick, 1000);

    // 深浅色切换（跟随系统偏好 + 手动记忆）
    const themeBtn = document.getElementById("themeBtn");
    const saved = localStorage.getItem("nav-theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const isDark = saved ? saved === "dark" : prefersDark;
    const applyTheme = (dark) => {
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      themeBtn.textContent = dark ? "🌙" : "☀️";
      localStorage.setItem("nav-theme", dark ? "dark" : "light");
    };
    applyTheme(isDark);
    themeBtn.addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme !== "dark");
    });

    // 初始化
    siteCount.textContent = SITES.length;
    renderChips();
    renderGrid();
  </script>
</body>
</html>

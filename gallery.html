<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="随机图库 · 从图片库随机挑选图片展示" />
  <title>随机图库 · 资源导航站</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg-soft: #0f1522;
      --card: rgba(21, 28, 44, 0.72);
      --card-hover: rgba(27, 36, 54, 0.92);
      --border: rgba(120, 140, 180, 0.16);
      --text: #e6eaf2;
      --muted: #8b95a9;
      --accent: #6c8cff;
      --accent-2: #38bdf8;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    [data-theme="light"] {
      --bg: #f4f6fb;
      --card: rgba(255, 255, 255, 0.85);
      --card-hover: #ffffff;
      --border: rgba(15, 25, 45, 0.10);
      --text: #1c2433;
      --muted: #5c6675;
      --shadow: 0 10px 26px rgba(30, 50, 90, 0.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at 15% -5%, rgba(108, 140, 255, 0.16), transparent 60%),
        radial-gradient(800px 460px at 90% 0%, rgba(56, 189, 248, 0.12), transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* ===== 顶栏 ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      max-width: 1180px; margin: 0 auto; padding: 18px 22px 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center; font-size: 19px;
      box-shadow: 0 4px 14px rgba(108, 140, 255, 0.4);
    }
    .nav { display: flex; gap: 8px; margin-left: auto; }
    .nav-link {
      padding: 7px 14px; border-radius: 10px; font-size: 13.5px;
      color: var(--muted); border: 1px solid transparent; white-space: nowrap;
      transition: all 0.18s ease;
    }
    .nav-link:hover { color: var(--text); background: var(--card); border-color: var(--border); }
    .nav-link.active {
      color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 600; box-shadow: 0 4px 14px rgba(108, 140, 255, 0.35);
    }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    #clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer; font-size: 16px;
      transition: transform 0.15s ease, background 0.2s;
    }
    .icon-btn:hover { transform: translateY(-1px); background: var(--card-hover); }

    /* ===== 头部 ===== */
    .hero { max-width: 1180px; margin: 0 auto; padding: 44px 22px 8px; text-align: center; }
    .hero h1 { font-size: clamp(26px, 4.5vw, 40px); letter-spacing: 1px; }
    .hero h1 .grad {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p { margin-top: 10px; color: var(--muted); font-size: 14px; }
    .hero .hint { margin-top: 8px; font-size: 12px; opacity: 0.8; }

    .controls { max-width: 1180px; margin: 22px auto 0; padding: 0 22px; text-align: center; }
    .btn {
      padding: 10px 26px; border: none; border-radius: 12px; cursor: pointer;
      font-size: 14.5px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 18px rgba(108, 140, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(108, 140, 255, 0.45); }
    .btn:active { transform: translateY(0); }

    /* ===== 图片网格 ===== */
    .grid {
      max-width: 1180px; margin: 26px auto 0; padding: 0 22px;
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    }
    .img-card {
      position: relative; border-radius: 16px; overflow: hidden; cursor: zoom-in;
      border: 1px solid var(--border); background: var(--card);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      opacity: 0; animation: fadeUp 0.4s ease forwards;
      animation-delay: calc(var(--i) * 40ms);
    }
    .img-card:hover {
      transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .img-wrap {
      position: relative; aspect-ratio: 4 / 3; overflow: hidden;
      background: linear-gradient(135deg, rgba(108,140,255,0.10), rgba(56,189,248,0.10));
    }
    .img-wrap .placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 38px; color: var(--muted); opacity: 0.6;
    }
    .img-wrap img {
      position: relative; width: 100%; height: 100%; object-fit: cover;
      display: block; transition: transform 0.35s ease;
    }
    .img-card:hover .img-wrap img { transform: scale(1.06); }
    .img-card figcaption {
      padding: 10px 14px; font-size: 13px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .empty { max-width: 1180px; margin: 60px auto; text-align: center; color: var(--muted); }
    .empty .big { font-size: 42px; margin-bottom: 12px; }

    /* ===== 灯箱 ===== */
    #lightbox {
      position: fixed; inset: 0; z-index: 100; display: none;
      align-items: center; justify-content: center;
      background: rgba(5, 8, 15, 0.88); backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #lightbox.open { display: flex; }
    #lightbox .stage { position: relative; max-width: min(92vw, 1080px); text-align: center; }
    #lightbox img {
      max-width: 100%; max-height: 78vh; border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    #lightbox .lb-title {
      margin-top: 14px; font-size: 14px; color: rgba(230, 234, 242, 0.85);
    }
    .lb-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 19px; cursor: pointer;
      transition: background 0.15s ease;
    }
    .lb-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .lb-prev { left: -64px; } .lb-next { right: -64px; }
    .lb-close {
      position: absolute; top: -46px; right: 0; width: 40px; height: 40px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 17px; cursor: pointer;
    }
    .lb-close:hover { background: rgba(255, 255, 255, 0.2); }
    @media (max-width: 700px) {
      .lb-prev { left: 6px; } .lb-next { right: 6px; }
      .lb-close { top: -46px; right: 0; }
    }

    footer {
      max-width: 1180px; margin: 46px auto 0; padding: 26px 22px 34px;
      text-align: center; font-size: 12.5px; color: var(--muted);
      border-top: 1px solid var(--border); opacity: 0.9;
    }

    @media (max-width: 640px) {
      .brand span { display: none; }
      .topbar { padding-top: 14px; }
      #clock { display: none; }
      .hero { padding-top: 34px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
    }
  </style>
</head>

    /* ================= 渲染逻辑（一般无需修改） ================= */
    const BATCH_SIZE = 12;          // 每次随机展示的张数
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const totalCount = document.getElementById("totalCount");
    const shownCount = document.getElementById("shownCount");

    let batch = [];                 // 当前这一批图片
    let lbIndex = 0;                // 灯箱当前索引

    // Fisher-Yates 洗牌
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderGrid() {
      if (!IMAGES.length) { grid.innerHTML = ""; empty.hidden = false; return; }
      empty.hidden = true;
      // 先从未展示过的图里抽，不足再回全库补，避免连续两批重复
      const lastSrc = new Set(batch.map(b => b.src));
      const fresh = IMAGES.filter(it => !lastSrc.has(it.src));
      const pool = fresh.length >= BATCH_SIZE ? fresh : IMAGES;
      batch = shuffle(pool).slice(0, Math.min(BATCH_SIZE, pool.length));
      shownCount.textContent = batch.length;
      totalCount.textContent = IMAGES.length;

      grid.innerHTML = batch.map((item, i) => `
        <figure class="img-card" style="--i:${i}" data-index="${i}" tabindex="0" role="button"
                aria-label="预览：${item.title || "图片"}">
          <div class="img-wrap">
            <span class="placeholder">🖼️</span>
            <img src="${item.src}" alt="${item.title || "图片"}" loading="lazy" decoding="async"
                 onerror="this.style.display='none'" />
          </div>
          <figcaption>${item.title || ""}</figcaption>
        </figure>`).join("");
    }

    /* ---------- 灯箱 ---------- */
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbTitle = document.getElementById("lbTitle");

    function openLightbox(i) {
      lbIndex = i;
      const item = batch[lbIndex];
      lbImg.src = item.src;
      lbImg.alt = item.title || "图片";
      lbTitle.textContent = item.title || "";
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
    }
    function step(delta) {
      lbIndex = (lbIndex + delta + batch.length) % batch.length;
      const item = batch[lbIndex];
      lbImg.src = item.src;
      lbImg.alt = item.title || "图片";
      lbTitle.textContent = item.title || "";
    }

    // 事件委托：点击卡片 → 灯箱
    grid.addEventListener("click", (e) => {
      const card = e.target.closest(".img-card");
      if (card) openLightbox(Number(card.dataset.index));
    });
    grid.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        const card = e.target.closest(".img-card");
        if (card) { e.preventDefault(); openLightbox(Number(card.dataset.index)); }
      }
    });
    document.getElementById("lbClose").addEventListener("click", closeLightbox);
    document.getElementById("lbPrev").addEventListener("click", () => step(-1));
    document.getElementById("lbNext").addEventListener("click", () => step(1));
    lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });

    // 换一批
    shuffleBtn.addEventListener("click", renderGrid);

    // 快捷键：Esc 关闭 · ←→ 切换 · R 换一批
    document.addEventListener("keydown", (e) => {
      if (lightbox.classList.contains("open")) {
        if (e.key === "Escape") closeLightbox();
        else if (e.key === "ArrowLeft") step(-1);
        else if (e.key === "ArrowRight") step(1);
        return;
      }
      if ((e.key === "r" || e.key === "R") &&
          !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        renderGrid();
      }
    });

    /* ---------- 时钟 & 主题（与首页同步） ---------- */
    function tick() {
      const now = new Date();
      const week = ["日", "一", "二", "三", "四", "五", "六"][now.getDay()];
      const pad = n => String(n).padStart(2, "0");
      document.getElementById("clock").textContent =
        `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 周${week} ` +
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    tick(); setInterval(tick, 1000);

    const themeBtn = document.getElementById("themeBtn");
    const saved = localStorage.getItem("nav-theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const isDark = saved ? saved === "dark" : prefersDark;
    const applyTheme = (dark) => {
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      themeBtn.textContent = dark ? "🌙" : "☀️";
      localStorage.setItem("nav-theme", dark ? "dark" : "light");
    };
    applyTheme(isDark);
    themeBtn.addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme !== "dark");
    });

    renderGrid();
  </script>
</body>
</html>
